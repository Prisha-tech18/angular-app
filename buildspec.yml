version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing dependencies..."
      - npm install

  build:
    commands:
      - echo "Building Angular application..."
      - npm run build
      - cp appspec.yml dist/angular-app/browser/
      - cp -r scripts dist/angular-app/browser/

artifacts:
  base-directory: dist/angular-app/browser
  files:
    - '**/*'
